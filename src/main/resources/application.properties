spring.application.name=shared-project
spring.thymeleaf.cache=false
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/pin_note}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:pin_note}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
pin-note.geocoding-url=${GEOCODING_URL:https://nominatim.openstreetmap.org/reverse}
pin-note.geocoding-enabled=${GEOCODING_ENABLED:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
